<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ─── PWA ─── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5A623" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Porokhane" />

    <script>
      // En développement, un ancien cache PWA peut servir des fichiers React périmés.
      // On le nettoie en arrière-plan et on ne réactive pas le SW en local.
      window.__POROKHANE_IS_LOCAL__ = ['localhost', '127.0.0.1'].includes(window.location.hostname)

      if (window.__POROKHANE_IS_LOCAL__) {
        const unregisterWorkers = 'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then(registrations =>
              Promise.all(registrations.map(registration => registration.unregister()))
            )
          : Promise.resolve()
        const clearCaches = 'caches' in window
          ? caches.keys().then(keys => Promise.all(
              keys.filter(key => key.startsWith('porokhane-')).map(key => caches.delete(key))
            ))
          : Promise.resolve()

        Promise.allSettled([unregisterWorkers, clearCaches]).catch(() => {})
      }
    </script>

    <!-- ─── ICÔNE APPLE (iPhone) ─── -->
    <link rel="apple-touch-icon" href="/images/porokhane-logo.webp" />

    <!-- ─── SEO ─── -->
    <title>Porokhane Shop — Mode, Voiles & Accessoires à Dakar</title>
    <meta name="description" content="Porokhane Shop : mode, voiles et accessoires à Dakar, dont Zikr Ring iQibla et chapelets électroniques. Élégance, Pudeur et Classe en parfaite symbiose." />
    <meta name="keywords" content="mode, voile, hijab, accessoires, Zikr Ring iQibla, chapelet électronique, Dakar, Sénégal" />

    <!-- ─── OG (partage réseaux sociaux) ─── -->
    <meta property="og:title" content="Porokhane Shop" />
    <meta property="og:description" content="Mode, voiles et accessoires. Élégance, Pudeur et Classe en parfaite symbiose." />
    <meta property="og:image" content="https://fedznkkxobzgzsbybozb.supabase.co/storage/v1/object/public/product-images/Porokhane%20SHOP.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" /></noscript>

    <!-- ─── SPLASH SCREEN iOS ─── -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      /* Splash screen pendant le chargement */
      #splash {
        position: fixed; inset: 0;
        background: #1A1A1A;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px; z-index: 9999;
        transition: opacity .4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img {
        width: 100px; height: 100px;
        border-radius: 50%;
        border: 3px solid #F5A623;
        box-shadow: 0 0 30px rgba(245,166,35,.4);
        animation: pop .5s ease;
      }
      #splash p {
        font-family: Georgia, serif;
        font-size: 16px; color: #F5A623;
        font-style: italic; letter-spacing: .5px;
      }
      #splash .loader {
        width: 40px; height: 3px;
        background: rgba(255,255,255,.1);
        border-radius: 2px; overflow: hidden;
      }
      #splash .loader-bar {
        height: 100%; width: 0%;
        background: #F5A623; border-radius: 2px;
        animation: load 1.2s ease forwards;
      }
      #splash .retry-button {
        min-height: 44px; padding: 10px 18px;
        border: 1px solid #F5A623; border-radius: 999px;
        background: transparent; color: #fff;
        font: 600 12px/1.2 Arial, sans-serif;
        cursor: pointer;
      }
      @keyframes pop {
        from { transform: scale(.8); opacity: 0; }
        to   { transform: scale(1);  opacity: 1; }
      }
      @keyframes load {
        to { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash img, #splash .loader-bar { animation: none; transition: none; }
      }
    </style>
  </head>
  <body>

    <!-- SPLASH SCREEN -->
    <div id="splash">
      <img
        src="/images/porokhane-logo.webp"
        alt="Porokhane Shop"
        onerror="this.style.display='none'"
      />
      <p>Élégance, Pudeur et Classe en parfaite symbiose</p>
      <div class="loader"><div class="loader-bar"></div></div>
    </div>

    <!-- APP REACT -->
    <div id="root"></div>

    <script>
      let slowLoadingTimer

      const hideSplash = () => {
        const splash = document.getElementById('splash')
        if (!splash || splash.classList.contains('hide')) return
        clearTimeout(slowLoadingTimer)
        splash.classList.add('hide')
        setTimeout(() => splash.remove(), 350)
      }
      window.addEventListener('porokhane:ready', () => setTimeout(hideSplash, 180), { once: true })

      const showLoadingHelp = () => {
        const splash = document.getElementById('splash')
        if (!splash || splash.classList.contains('hide')) return
        const message = splash.querySelector('p')
        const loader = splash.querySelector('.loader')
        if (message) message.textContent = 'Le chargement prend plus de temps que prévu.'
        if (loader) loader.remove()
        if (!splash.querySelector('.retry-button')) {
          const retry = document.createElement('button')
          retry.type = 'button'
          retry.className = 'retry-button'
          retry.textContent = 'Réessayer'
          retry.addEventListener('click', () => window.location.reload())
          splash.appendChild(retry)
        }
      }
      slowLoadingTimer = setTimeout(showLoadingHelp, 8000)

      // Le service worker est réservé au site déployé, jamais au serveur Vite local.
      if (!window.__POROKHANE_IS_LOCAL__ && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(registration => registration.update())
            .catch(() => {})
        })
      }
    </script>

    <script type="module" src="/src/main.jsx?v=14"></script>
  </body>
</html>
